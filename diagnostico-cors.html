<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 Diagnóstico CORS - Supabase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 28px;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            color: #4a5568;
            font-size: 18px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e2e8f0;
        }
        .test-item {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #cbd5e0;
        }
        .test-item.success {
            background: #f0fff4;
            border-left-color: #48bb78;
        }
        .test-item.error {
            background: #fff5f5;
            border-left-color: #f56565;
        }
        .test-item.warning {
            background: #fffaf0;
            border-left-color: #ed8936;
        }
        .test-name {
            font-weight: 600;
            color: #2d3748;
            margin-bottom: 5px;
        }
        .test-result {
            font-size: 14px;
            color: #4a5568;
            font-family: 'Courier New', monospace;
        }
        .button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
        }
        .button:hover {
            transform: translateY(-2px);
        }
        .button:active {
            transform: translateY(0);
        }
        .icon {
            display: inline-block;
            margin-right: 8px;
        }
        .loading {
            text-align: center;
            color: #718096;
            padding: 20px;
        }
        .spinner {
            border: 3px solid #e2e8f0;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .info-box {
            background: #ebf8ff;
            border: 1px solid #bee3f8;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .info-box strong {
            color: #2c5282;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Diagnóstico CORS - Supabase</h1>
        <p class="subtitle">Verificando configuração de CORS do servidor Supabase</p>

        <div class="info-box">
            <strong>📍 Servidor:</strong> https://finance-app-supabase-finance-app.rcnehy.easypanel.host<br>
            <strong>🌐 Origem:</strong> <span id="current-origin"></span>
        </div>

        <button class="button" onclick="runTests()">
            <span class="icon">🚀</span> Executar Diagnóstico
        </button>

        <div id="results"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://finance-app-supabase-finance-app.rcnehy.easypanel.host';
        const currentOrigin = window.location.origin;
        
        document.getElementById('current-origin').textContent = currentOrigin;

        async function runTests() {
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<div class="loading"><div class="spinner"></div>Executando testes...</div>';

            const results = [];

            // Teste 1: Preflight CORS
            results.push(await testCORSPreflight());

            // Teste 2: Health Check
            results.push(await testHealthEndpoint());

            // Teste 3: Auth Endpoint
            results.push(await testAuthEndpoint());

            // Teste 4: LocalStorage
            results.push(testLocalStorage());

            // Renderizar resultados
            renderResults(results);
        }

        async function testCORSPreflight() {
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/health`, {
                    method: 'OPTIONS',
                    headers: {
                        'Origin': currentOrigin,
                        'Access-Control-Request-Method': 'POST',
                        'Access-Control-Request-Headers': 'content-type,authorization'
                    }
                });

                const allowOrigin = response.headers.get('access-control-allow-origin');
                const allowMethods = response.headers.get('access-control-allow-methods');
                const allowHeaders = response.headers.get('access-control-allow-headers');

                if (allowOrigin) {
                    return {
                        name: '✅ CORS Preflight (OPTIONS)',
                        status: 'success',
                        message: `Origem permitida: ${allowOrigin}\nMétodos: ${allowMethods}\nHeaders: ${allowHeaders}`
                    };
                } else {
                    return {
                        name: '❌ CORS Preflight (OPTIONS)',
                        status: 'error',
                        message: `Nenhum header Access-Control-Allow-Origin encontrado.\n\n⚠️ SOLUÇÃO: Configure as variáveis de ambiente no Easypanel:\nADDITIONAL_REDIRECT_URLS=${currentOrigin}\nSITE_URL=${currentOrigin}`
                    };
                }
            } catch (error) {
                return {
                    name: '❌ CORS Preflight (OPTIONS)',
                    status: 'error',
                    message: `Erro: ${error.message}\n\n⚠️ Isso indica que o CORS está bloqueando a requisição.`
                };
            }
        }

        async function testHealthEndpoint() {
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/health`);
                const data = await response.json();

                return {
                    name: '✅ Health Check',
                    status: 'success',
                    message: `Status: ${response.status}\nResposta: ${JSON.stringify(data, null, 2)}`
                };
            } catch (error) {
                return {
                    name: '❌ Health Check',
                    status: 'error',
                    message: `Erro: ${error.message}`
                };
            }
        }

        async function testAuthEndpoint() {
            try {
                const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyAgCiAgICAicm9sZSI6ICJhbm9uIiwKICAgICJpc3MiOiAic3VwYWJhc2UtZGVtbyIsCiAgICAiaWF0IjogMTY0MTc2OTIwMCwKICAgICJleHAiOiAxNzk5NTM1NjAwCn0.dc_X5iR_VP_qT0zsiyj_I_OZ2T9FtRU2BBNWN8Bu4GE'
                    },
                    body: JSON.stringify({ refresh_token: 'dummy_token' })
                });

                if (response.status === 400 || response.status === 401) {
                    return {
                        name: '✅ Auth Endpoint (CORS OK)',
                        status: 'success',
                        message: `Status ${response.status} - CORS está permitindo a requisição!\nO erro 400/401 é esperado (token inválido).`
                    };
                }

                return {
                    name: '⚠️ Auth Endpoint',
                    status: 'warning',
                    message: `Status inesperado: ${response.status}`
                };
            } catch (error) {
                if (error.message.includes('CORS')) {
                    return {
                        name: '❌ Auth Endpoint (CORS BLOQUEADO)',
                        status: 'error',
                        message: `CORS está bloqueando a requisição!\n\n⚠️ AÇÃO NECESSÁRIA:\n1. Acesse o Easypanel\n2. Adicione as variáveis de ambiente:\n   ADDITIONAL_REDIRECT_URLS=${currentOrigin}\n   SITE_URL=${currentOrigin}\n3. Reinicie o serviço Supabase`
                    };
                }

                return {
                    name: '❌ Auth Endpoint',
                    status: 'error',
                    message: `Erro: ${error.message}`
                };
            }
        }

        function testLocalStorage() {
            try {
                const keys = Object.keys(localStorage).filter(k => k.includes('supabase'));
                
                if (keys.length === 0) {
                    return {
                        name: '✅ LocalStorage (Limpo)',
                        status: 'success',
                        message: 'Nenhuma sessão Supabase armazenada.'
                    };
                }

                return {
                    name: '⚠️ LocalStorage (Sessão Expirada)',
                    status: 'warning',
                    message: `Encontradas ${keys.length} chaves do Supabase.\n\nExecute no console:\nlocalStorage.clear()\n\nDepois recarregue a página.`
                };
            } catch (error) {
                return {
                    name: '❌ LocalStorage',
                    status: 'error',
                    message: `Erro ao acessar localStorage: ${error.message}`
                };
            }
        }

        function renderResults(results) {
            const resultsDiv = document.getElementById('results');
            
            let html = '<div class="section"><h2>📊 Resultados do Diagnóstico</h2>';
            
            results.forEach(result => {
                html += `
                    <div class="test-item ${result.status}">
                        <div class="test-name">${result.name}</div>
                        <div class="test-result">${result.message}</div>
                    </div>
                `;
            });

            html += '</div>';

            // Adicionar recomendações
            const hasErrors = results.some(r => r.status === 'error');
            
            if (hasErrors) {
                html += `
                    <div class="section">
                        <h2>🔧 Próximos Passos</h2>
                        <div class="test-item warning">
                            <div class="test-name">📋 Instruções de Correção</div>
                            <div class="test-result">
1. Acesse o Easypanel: https://rcnehy.easypanel.host
2. Localize o serviço: finance-app-supabase
3. Adicione as variáveis de ambiente:
   
   ADDITIONAL_REDIRECT_URLS=${currentOrigin}
   SITE_URL=${currentOrigin}
   GOTRUE_SITE_URL=${currentOrigin}
   GOTRUE_URI_ALLOW_LIST=${currentOrigin}
   
4. Reinicie o serviço Supabase
5. Execute este diagnóstico novamente
6. Limpe o localStorage: localStorage.clear()
7. Recarregue a página e faça login
                            </div>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="section">
                        <h2>✅ Tudo OK!</h2>
                        <div class="test-item success">
                            <div class="test-name">🎉 CORS Configurado Corretamente</div>
                            <div class="test-result">
O servidor Supabase está aceitando requisições de ${currentOrigin}.

Se ainda estiver tendo problemas:
1. Limpe o localStorage: localStorage.clear()
2. Recarregue a página (Cmd+Shift+R ou Ctrl+Shift+R)
3. Faça login novamente
                            </div>
                        </div>
                    </div>
                `;
            }

            resultsDiv.innerHTML = html;
        }
    </script>
</body>
</html>
